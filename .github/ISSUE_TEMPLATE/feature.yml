name: Feature request
description: Propose a user-visible capability or improvement
title: "feat: "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Describe the user problem first. This project tracks criteria and acceptance tests, not calendar estimates.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What can a designer, developer or agent not do today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: What should the user see or be able to do?
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: In scope and explicitly out of scope.
      placeholder: |
        In scope:
        - ...

        Out of scope:
        - ...
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Testable outcomes, including commands, files, security and accessibility.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: What simpler or different approaches were rejected and why?
  - type: dropdown
    id: surface
    attributes:
      label: Primary surface
      multiple: true
      options:
        - Editor canvas
        - Inspector / panels
        - Design file / schema
        - Command protocol
        - CLI
        - Live bridge
        - MCP / agents
        - Export / handoff
        - Workspace / dev servers
        - Capture / frontend target
        - Documentation / workflow
    validations:
      required: true
  - type: textarea
    id: risks
    attributes:
      label: Security, migration or compatibility risks
      description: Filesystem, process, network, agent permissions, schema migration or backwards compatibility.
  - type: checkboxes
    id: checks
    attributes:
      label: Readiness
      options:
        - label: This may need an ADR or a change to an existing ADR.
        - label: This changes the design file, command or MCP contract.
        - label: This changes export or rendered untrusted content.
        - label: This affects security boundaries or permissions.
