name: Engineering task
description: Track refactoring, hardening, release or documentation work
title: "chore: "
labels: [documentation]
body:
  - type: textarea
    id: outcome
    attributes:
      label: Outcome
      description: What should be true when this task is complete?
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: Concrete changes and explicit non-goals.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Commands, checks, docs or release artifacts that prove completion.
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies and follow-ups
      description: Link blocking issues, ADRs or external decisions.
  - type: checkboxes
    id: impact
    attributes:
      label: Impact
      options:
        - label: Changes runtime behavior.
        - label: Changes repository workflow or release process.
        - label: Requires documentation and changelog updates.
        - label: Requires a migration, release note or post-release sweep.
