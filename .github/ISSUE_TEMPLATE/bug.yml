name: Bug report
description: Report a reproducible defect in Weft
title: "fix: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Do not include secrets, customer data or private design contents.
        Security vulnerabilities must be reported privately according to SECURITY.md.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What is broken, in one or two sentences?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What should happen instead?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Exact steps, commands, design/page or URL needed to reproduce.
      placeholder: |
        1. Open ...
        2. Select ...
        3. See ...
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, browser, Node/pnpm, Weft commit and live/static mode.
    validations:
      required: true
  - type: dropdown
    id: severity
    attributes:
      label: Severity
      options:
        - Blocking / data loss
        - Major
        - Minor
        - Cosmetic
    validations:
      required: true
  - type: textarea
    id: cause
    attributes:
      label: Suspected cause or relevant code
      description: Optional, but useful if you already inspected the repository.
  - type: textarea
    id: proposed_fix
    attributes:
      label: Proposed fix or deferral
      description: If known, describe the fix or why it can be deferred.
